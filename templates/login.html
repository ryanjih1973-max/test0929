{% extends "base.html" %}

{% block title %}管理員登入 - 訂單管理系統{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">管理員登入</h3>
                    <p class="text-muted small">請輸入管理員帳號與密碼以繼續</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">帳號</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-label form-control border-start-0 bg-light" id="username" name="username" placeholder="請輸入帳號 (預設: admin)" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">密碼</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 bg-light" id="password" name="password" placeholder="請輸入密碼 (預設: admin123)" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>登入系統
                        </button>
                    </div>
                </form>

                <div class="mt-4 p-3 bg-light rounded-3 small border">
                    <span class="fw-bold text-dark"><i class="bi bi-info-circle text-primary me-1"></i>測試帳號資訊：</span>
                    <ul class="mb-0 mt-1 ps-3 text-secondary">
                        <li>帳號：<code>admin</code></li>
                        <li>密碼：<code>admin123</code></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
